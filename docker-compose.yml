services:
  webhook2mqtt:
    build: .
    restart: always
    # Expose locally; put a reverse proxy (e.g. Traefik, see below) in front for HTTPS.
    ports:
      - "127.0.0.1:5058:80"
#    dns_search: lan
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MQTT_SERVER: ${MQTT_SERVER}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_PATH: ${MQTT_PATH:-webhook}
      # MQTT_USER: ${MQTT_USER}
      # MQTT_PASSWORD: ${MQTT_PASSWORD}
      # MQTT_TLS: ${MQTT_TLS:-false}
      # MQTT_CA_CERTS: ${MQTT_CA_CERTS}
      # MQTT_QOS: ${MQTT_QOS:-0}
      # MQTT_RETAIN: ${MQTT_RETAIN:-true}
      # MQTT_REPORT_ERRORS: ${MQTT_REPORT_ERRORS:-false}
      # MQTT_PUBLISH_TIMEOUT: ${MQTT_PUBLISH_TIMEOUT:-5}
      # ALLOW_SUBTOPICS: ${ALLOW_SUBTOPICS:-false}
      # TIMESTAMP_FIELD: ${TIMESTAMP_FIELD:-timestamp}
      # WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      # LOG_LEVEL: ${LOG_LEVEL:-INFO}
# example config for https with traefik (remove `ports:` above when using it)
